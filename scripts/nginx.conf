# RailAlert Nginx Configuration
# Reverse Proxy & React SPA Static Host for AWS EC2

# Upstream definition for Gunicorn/Uvicorn backend workers
upstream railalert_backend {
    server 127.0.0.1:8000 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    
    server_name _; # Catch-all for EC2 Public IP or replace with custom domain

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum payload size for complaint photos & lost property evidence uploads
    client_max_body_size 25M;

    # Enable Gzip Compression to conserve EC2 data transfer out
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Access & Error Logging
    access_log /var/log/nginx/railalert_access.log;
    error_log /var/log/nginx/railalert_error.log warn;

    # 1. API Reverse Proxy to FastAPI (Gunicorn/Uvicorn on Port 8000)
    location /api/ {
        proxy_pass http://railalert_backend;
        proxy_http_version 1.1;

        # WebSocket & HTTP/1.1 headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client and protocol information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for large image uploads and SES dispatching
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # 2. FastAPI Interactive Swagger API Docs & Schema
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://railalert_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Static Assets Caching for React Frontend Build
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        root /var/www/railalert;
        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # 4. React SPA Static File Serving with HTML5 History Mode Routing
    location / {
        root /var/www/railalert;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Custom Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
